AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudNap - One-click setup for EC2 lifecycle management (cloudnap.in)'

Parameters:
  ExternalId:
    Type: String
    Description: Your unique External ID from CloudNap (found on the setup page)
    MinLength: 1
    ConstraintDescription: External ID cannot be empty. Copy it from your CloudNap setup page.

Resources:
  CloudNapPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: CloudNapPolicy
      Description: Grants CloudNap permission to manage EC2 instances
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudNapControl
            Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeVpcs
              - ec2:DescribeInstanceStatus
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:DescribeTags
              - ec2:DescribeVolumes
            Resource: '*'

  CloudNapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudnap-user
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::758026825879:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      ManagedPolicyArns:
        - !Ref CloudNapPolicy

Outputs:
  RoleARN:
    Description: Copy this Role ARN and paste it in CloudNap
    Value: !GetAtt CloudNapRole.Arn
  RoleName:
    Description: IAM Role name created for CloudNap
    Value: !Ref CloudNapRole
